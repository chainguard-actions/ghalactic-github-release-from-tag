name: Test generate release notes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create an annotated tag for the action to read
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a v3.0.0 -m "Release v3.0.0

          Release with auto-generated notes." HEAD || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          generateReleaseNotes: "true"
          summaryEnabled: "false"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.releaseId }}
          GENERATED_NOTES: ${{ steps.action.outputs.generatedReleaseNotes }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releaseId: $RELEASE_ID"
          echo "generatedReleaseNotes: $GENERATED_NOTES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but releaseId output is empty"
              exit 1
            fi
            echo "PASS: release with generated notes created, id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
