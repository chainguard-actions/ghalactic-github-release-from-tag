name: Test prerelease
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create an annotated pre-release tag for the action to read
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a v1.0.0-beta.1 -m "Pre-release v1.0.0-beta.1

          This is a beta pre-release." HEAD || true

      - id: action
        uses: .
        continue-on-error: true
        with:
          prerelease: "true"
          summaryEnabled: "false"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.releaseId }}
          TAG_IS_SEMVER: ${{ steps.action.outputs.tagIsSemVer }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releaseId: $RELEASE_ID"
          echo "tagIsSemVer: $TAG_IS_SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but releaseId output is empty"
              exit 1
            fi
            echo "PASS: prerelease created with id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
