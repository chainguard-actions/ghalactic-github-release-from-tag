name: Test draft release with generated notes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a stable semver test tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a v1.0.0-test -m "Stable release v1.0.0-test"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          draft: "true"
          generateReleaseNotes: "true"
          summaryEnabled: "false"

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.releaseId }}
          RELEASE_URL: ${{ steps.action.outputs.releaseUrl }}
          TAG_NAME: ${{ steps.action.outputs.tagName }}
          TAG_IS_SEMVER: ${{ steps.action.outputs.tagIsSemVer }}
          TAG_IS_STABLE: ${{ steps.action.outputs.tagIsStable }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releaseId: $RELEASE_ID"
          echo "releaseUrl: $RELEASE_URL"
          echo "tagName: $TAG_NAME"
          echo "tagIsSemVer: $TAG_IS_SEMVER"
          echo "tagIsStable: $TAG_IS_STABLE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but releaseId is empty"
              exit 1
            fi
            if [ -z "$RELEASE_URL" ]; then
              echo "FAIL: action succeeded but releaseUrl is empty"
              exit 1
            fi
            echo "PASS: draft release created with id=$RELEASE_ID url=$RELEASE_URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
