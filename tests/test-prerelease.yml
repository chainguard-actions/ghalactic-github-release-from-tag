name: Test prerelease flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a pre-release test tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag -a v0.0.1-alpha.1 -m "Pre-release v0.0.1-alpha.1"

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          prerelease: "true"
          draft: "true"
          summaryEnabled: "false"

      - name: Assert action ran and failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.releaseId }}
          TAG_NAME: ${{ steps.action.outputs.tagName }}
          TAG_IS_SEMVER: ${{ steps.action.outputs.tagIsSemVer }}
        run: |
          echo "outcome: $OUTCOME"
          echo "releaseId: $RELEASE_ID"
          echo "tagName: $TAG_NAME"
          echo "tagIsSemVer: $TAG_IS_SEMVER"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but releaseId is empty"
              exit 1
            fi
            echo "PASS: pre-release created with id=$RELEASE_ID tag=$TAG_NAME semver=$TAG_IS_SEMVER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
