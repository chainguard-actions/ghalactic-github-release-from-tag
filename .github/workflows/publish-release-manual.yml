# DO NOT EDIT - This file is managed by ghalactic/repos.
name: Publish release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish
        type: string
        required: true

jobs:
  publish:
    name: Ghalactic
    uses: ghalactic/repos/.github/workflows/shared-publish-release.yml@043a734b4fc560617a6f9448e1532ae02b397321 # main
    secrets: inherit
    permissions:
      contents: write
      discussions: write
    with:
      discussionCategory: Releases
      useReleaseActionMain: true
      tag: ${{ inputs.tag }}
